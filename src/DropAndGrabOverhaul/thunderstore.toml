[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "bobabulkerENTERPRISE"
name = "DropAndGrabOverhaul"
versionNumber = "0.1.0"
description = "Drop all items with one key, remove grab cooldown, and sell all scrap in inventory at the company desk. Fully configurable blacklists for both dropping and selling."
websiteUrl = "https://github.com/manvocao0271/DropAndGrabOverhaul"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/DropAndGrabOverhaul/release/com.github.manvocao0271.dropandgraboverhaul.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "lethal-company", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/lethal-company/category/
lethal-company = [ "mods", ]
