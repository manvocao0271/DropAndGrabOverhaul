[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "bobabulkerENTERPRISE"
name = "DropAndGrabOverhaul"
versionNumber = "0.1.7"
description = "[BETA] Double-tap G to drop all scrap. Hold G to force drop all items. Press G at the company to put all scrap on the sell counter at once. Remove grab item cooldown. ShipInventoryUpdated compatible (press G at the chute)."
websiteUrl = "https://github.com/manvocao0271/DropAndGrabOverhaul"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "../../icon.png"
readme = "../../THUNDERSTORE.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/DropAndGrabOverhaul/release/com.github.manvocao0271.dropandgraboverhaul.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "lethal-company", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/lethal-company/category/
lethal-company = [ "mods", ]
