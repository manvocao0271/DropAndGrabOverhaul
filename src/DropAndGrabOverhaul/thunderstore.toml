[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "bobabulkerENTERPRISE"
name = "DropAndGrabOverhaul"
versionNumber = "0.2.6"
description = "Double-tap your drop key to drop all scrap. Hold it to force drop all items. Press it at the company counter to put it all on to sell at once. Remove the grab item cooldown."
websiteUrl = ""
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "../../icon.png"
readme = "../../THUNDERSTORE.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/DropAndGrabOverhaul/release/bobabulkerENTERPRISE.DropAndGrabOverhaul.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "lethal-company", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/lethal-company/category/
lethal-company = [ "mods", ]
